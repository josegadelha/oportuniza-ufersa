# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5557/oportuniza
spring.datasource.username=postgres
spring.datasource.password=JosephPG19
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Executar data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
api.security.token.secret=oportuniza-test-secret-123456789

# Web
spring.web.error.include-stacktrace=always